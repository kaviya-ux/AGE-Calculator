<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Age Calculator</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 flex justify-center items-center min-h-screen">
    <div class="bg-white w-96 p-8 rounded-xl shadow-lg">
        <h1 class="text-3xl font-bold text-center text-blue-600 mb-6">
            Age Calculator
        </h1>
        <!-- Date Input -->
        <label class="font-semibold text-gray-700">
            Enter Your Date of Birth
        </label>
        <input type="date" id="dob"
            class="w-full mt-2 p-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
        <!-- Button -->
        <button onclick="calculateAge()"
            class="w-full mt-5 bg-blue-500 hover:bg-blue-600 text-white font-semibold py-3 rounded-lg">
            Calculate Age
        </button>
        <!-- Result -->
        <div id="result"
            class="mt-6 bg-blue-50 border border-blue-200 rounded-lg p-4 hidden">
        </div>
    </div>
<script>
    
function calculateAge() {
    let dob = document.getElementById("dob").value;
    if(dob === ""){
        alert("Please select your Date of Birth");
        return;
    }
    let birthDate = new Date(dob);
    let today = new Date();
    let age = today.getFullYear() - birthDate.getFullYear();
    let month = today.getMonth() - birthDate.getMonth();
    if(month < 0 || (month === 0 && today.getDate() < birthDate.getDate())){
        age--;
    }
    // Day Names
    let days = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
    
    // Month Names
    let months = ["January","February","March","April","May","June","July","August","September","October","November","December"];
    let birthDay = days[birthDate.getDay()];
    let birthMonth = months[birthDate.getMonth()];
    let status = "";
    if(age < 13){
        status = "Child";
    }
    else if(age < 20){
        status = "Teenager";
    }
    else if(age < 60){
        status = "Adult";
    }
    else{
        status = "Senior Citizen";
    }
    let result = document.getElementById("result");
    result.classList.remove("hidden");
    result.innerHTML = `
        <h2 class="text-2xl font-bold text-center text-blue-600 mb-4">
            Age Details
        </h2>
        <p class="mb-2"><strong>Age :</strong> ${age} Years</p>
        <p class="mb-2"><strong>Date of Birth :</strong> ${dob}</p>
        <p class="mb-2"><strong>Birth Day :</strong> ${birthDay}</p>
        <p class="mb-2"><strong>Birth Month :</strong> ${birthMonth}</p>
        <p class="mb-2"><strong>Birth Year :</strong> ${birthDate.getFullYear()}</p>
        <p class="mb-2"><strong>Current Date :</strong> ${today.toLocaleDateString()}</p>
        <p class="mb-2"><strong>Current Year :</strong> ${today.getFullYear()}</p>
        <p class="mb-2"><strong>Status :</strong> ${status}</p>
    `;
}
</script>
</body>
</html>
