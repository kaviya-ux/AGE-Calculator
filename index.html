<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Age Calculator</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-indigo-100 to-purple-200 min-h-screen flex items-center justify-center p-4">

  <div class="bg-white shadow-xl rounded-2xl p-8 w-full max-w-md">
    <h1 class="text-2xl font-bold text-center text-indigo-700 mb-6">Age Calculator</h1>

    <label for="dob" class="block text-sm font-medium text-gray-600 mb-2">
      Enter your Date of Birth
    </label>
    <input
      type="date"
      id="dob"
      class="w-full border border-gray-300 rounded-lg p-2 mb-4 focus:outline-none focus:ring-2 focus:ring-indigo-400"
    />

    <button
      onclick="calculateAge()"
      class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2 rounded-lg transition"
    >
      Calculate Age
    </button>

    <div id="result" class="hidden mt-6 bg-indigo-50 rounded-lg p-4 text-gray-700 space-y-1"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
