
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Age Calculator</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 flex justify-center items-center min-h-screen">
    <div class="bg-white w-96 p-8 rounded-xl shadow-lg">
        <h1 class="text-3xl font-bold text-center text-blue-600 mb-6">
            Age Calculator
        </h1>
        <!-- Date Input -->
        <label class="font-semibold text-gray-700">
            Enter Your Date of Birth
        </label>
        <input type="date" id="dob"
            class="w-full mt-2 p-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
        <!-- Button -->
        <button onclick="calculateAge()"
            class="w-full mt-5 bg-blue-500 hover:bg-blue-600 text-white font-semibold py-3 rounded-lg">
            Calculate Age
        </button>
        <!-- Result -->
        <div id="result"
            class="mt-6 bg-blue-50 border border-blue-200 rounded-lg p-4 hidden">
        </div>
    </div>
</body>
</html>
